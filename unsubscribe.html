<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Unsubscribe · The Chief Negotiators</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B0B0E;font-family:-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;color:#F4EEE3;padding:24px;box-sizing:border-box}
  .c{max-width:440px;width:100%;text-align:center;background:#15151A;border:1px solid #2A2A31;border-radius:10px;padding:40px 32px}
  .brand{font-size:11px;letter-spacing:.24em;color:#C9A24B;font-weight:600;margin-bottom:22px}
  h1{margin:0 0 12px;font-size:22px;font-weight:600;letter-spacing:-.01em}
  p{margin:0 0 24px;font-size:15px;line-height:1.6;color:#B8B0A2}
  button{font:inherit;font-size:15px;font-weight:600;padding:12px 26px;border-radius:6px;border:0;background:#C9A24B;color:#0B0B0E;cursor:pointer}
  button[disabled]{opacity:.6;cursor:default}
  .err{color:#FF8C8C}
</style>
</head>
<body>
<!-- cn-unsubscribe-page: the unsubscribe function checks for this marker before redirecting here. -->
<div class="c">
  <div class="brand">THE CHIEF NEGOTIATORS</div>
  <h1 id="t">Unsubscribe?</h1>
  <p id="m">Confirm below and we will stop emailing you. Nothing has changed yet.</p>
  <button id="b" type="button">Confirm unsubscribe</button>
</div>
<script>
(function () {
  var FN = 'https://stpkhpxhqzgruorrupaw.supabase.co/functions/v1/unsubscribe';
  var qs = location.search.replace(/^\?/, '');
  var p = new URLSearchParams(qs);
  var t = document.getElementById('t'), m = document.getElementById('m'), b = document.getElementById('b');
  function done(title, msg, isErr) { t.textContent = title; m.textContent = msg; m.className = isErr ? 'err' : ''; b.style.display = 'none'; }
  if (p.get('t') === '1') { done('Test email', 'This was a test send, so the unsubscribe link is inactive. Nothing changed.'); return; }
  if (!p.get('k') && !p.get('e') && !p.get('c')) { done('Link incomplete', 'This link is missing its identifier. Reply to the email and we will remove you by hand.', true); return; }
  b.addEventListener('click', function () {
    b.disabled = true; b.textContent = 'Working…';
    fetch(FN + '?' + qs, { method: 'POST' }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      done("You're unsubscribed", 'You will not receive further emails from us. Nothing else is needed on your end.');
    }).catch(function () {
      b.disabled = false; b.textContent = 'Try again';
      m.textContent = 'That did not go through. Try again, or reply to the email and we will remove you by hand.'; m.className = 'err';
    });
  });
})();
</script>
</body>
</html>
