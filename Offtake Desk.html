* ============================================================\n     COLOR — mono-accent system on pure black.\n     ONE accent. The black is doing the heavy lifting.\n     ============================================================ */\n\n  /* Canvas */\n  --cn-black:           #000000;   /* the one true background */\n  --cn-black-95:        #0a0a0a;   /* hairline lift, rarely used */\n\n  /* Brand accent — warm champagne-rose */\n  --cn-gold:            #C49F8C;   /* THE brand color. logo, headlines, italics, icons */\n  --cn-gold-bright:     #D8B5A2;   /* hover state */\n  --cn-gold-dim:        #9A7E70;   /* disabled / very-low-emphasis */\n  --cn-gold-tint-12:    rgba(196, 159, 140, 0.12); /* faint fills */\n  --cn-gold-tint-24:    rgba(196, 159, 140, 0.24); /* hairline borders */\n\n  /* Surface — dark warm gray cards on black */\n  --cn-surface:         #464342;   /* card / panel surface */\n  --cn-surface-hover:   #535050;   /* card hover */\n  --cn-surface-edge:    #6F6C6C;   /* hairline divider, ~50% on black */\n\n  /* Foreground — warm whites, never pure cool white */\n  --cn-fg:              #FFFFFF;   /* primary text on dark surfaces */\n  --cn-fg-muted:        #E2E2E1;   /* secondary text, body on black */\n  --cn-fg-subtle:       #B8B2B0;   /* tertiary, captions */\n  --cn-fg-faint:        #6F6C6C;   /* dividers, disabled */\n\n  /* Semantic — alias the brand colors for design-system use */\n  --cn-fg1:             var(--cn-fg);\n  --cn-fg2:             var(--cn-fg-muted);\n  --cn-fg3:             var(--cn-fg-subtle);\n  --cn-bg1:             var(--cn-black);\n  --cn-bg2:             var(--cn-surface);\n  --cn-accent:          var(--cn-gold);\n  --cn-accent-hover:    var(--cn-gold-bright);\n  --cn-divider:         var(--cn-surface-edge);\n\n  /* ============================================================\n     TYPE — serif end-to-end. No sans anywhere.\n     ============================================================ */\n\n  --cn-font-display:    'Cormorant Garamond', 'EB Garamond', Garamond, 'Times New Roman', serif;\n  --cn-font-body:       'Cardo', 'Cormorant Garamond', Garamond, Georgia, serif;\n  --cn-font-mono:       'Courier New', ui-monospace, monospace;\n\n  /* Weights */\n  --cn-w-regular:       400; /* @kind font */\n  --cn-w-medium:        500; /* @kind font */\n  --cn-w-semibold:      600; /* @kind font */\n  --cn-w-bold:          700; /* @kind font */\n\n  /* Sizes — display is generous; body holds at 15–17px */\n  --cn-size-display:    72px;   /* h1 hero (mobile scales down) */\n  --cn-size-h1:         52px;   /* section header */\n  --cn-size-h2:         36px;   /* sub-section / card-cluster head */\n  --cn-size-h3:         24px;   /* card title, service name */\n  --cn-size-h4:         20px;   /* small section head */\n  --cn-size-lead:       18px;   /* lead paragraph under heroes */\n  --cn-size-body:       16px;   /* default body */\n  --cn-size-small:      14px;   /* card body, footnotes */\n  --cn-size-caption:    12px;   /* tracked all-caps label */\n\n  /* Line heights — serif copy gets generous leading */\n  --cn-lh-tight:        1.05 /* @kind font */;   /* display headlines */\n  --cn-lh-snug:         1.2 /* @kind font */;    /* h2/h3 */\n  --cn-lh-normal:       1.5 /* @kind font */;    /* body */\n  --cn-lh-loose:        1.7 /* @kind font */;    /* long-form body */\n\n  /* Tracking */\n  --cn-tracking-tight:  -0.01em;\n  --cn-tracking-normal: 0;\n  --cn-tracking-wide:   0.08em;\n  --cn-tracking-label:  0.18em; /* tracked all-caps kicker labels */\n\n  /* ============================================================\n     SPACING — 8px scale, generous at the section level\n     ============================================================ */\n  --cn-space-1:   4px;\n  --cn-space-2:   8px;\n  --cn-space-3:   12px;\n  --cn-space-4:   16px;\n  --cn-space-5:   24px;\n  --cn-space-6:   32px;\n  --cn-space-7:   48px;\n  --cn-space-8:   64px;\n  --cn-space-9:   96px;\n  --cn-space-10:  144px;   /* between major sections */\n\n  /* ============================================================\n     BORDERS / RADII / ELEVATION\n     Sharp corners. No shadows. Hairline borders only.\n     ============================================================ */\n  --cn-radius-0:  0px;     /* default — sharp */\n  --cn-radius-1:  2px;     /* the absolute most softness allowed */\n  --cn-radius-2:  4px;     /* never use; included for parity */\n\n  --cn-border-hair:   1px solid var(--cn-surface-edge);\n  --cn-border-gold:   1px solid var(--cn-gold);\n  --cn-border-gold-faint: 1px solid var(--cn-gold-tint-24);\n\n  --cn-shadow-none:   none;   /* the brand. */\n\n  /* ============================================================\n     MOTION — slow, considered, ease-out. Never bouncy.\n     ============================================================ */\n  --cn-duration-fast:    150ms; /* @kind other */\n  --cn-duration:         300ms; /* @kind other */\n  --cn-duration-slow:    500ms; /* @kind other */\n  --cn-ease:             cubic-bezier(0.22, 0.61, 0.36, 1) /* @kind other */;  /* ease-out */\n\n  /* Layout */\n  --cn-content-max:      640px;     /* body paragraph max-width */\n  --cn-section-max:      1080px;    /* section content max-width */\n  --cn-page-max:         1280px;    /* page rail */\n}\n\n/* ============================================================\n   SEMANTIC ELEMENT STYLES\n   Apply these as base styles when scaffolding pages.\n   ============================================================ */\n\n.cn-page {\n  background: var(--cn-bg1);\n  color: var(--cn-fg2);\n  font-family: var(--cn-font-body);\n  font-size: var(--cn-size-body);\n  line-height: var(--cn-lh-normal);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n.cn-display {\n  font-family: var(--cn-font-display);\n  font-size: var(--cn-size-display);\n  font-weight: var(--cn-w-regular);\n  line-height: var(--cn-lh-tight);\n  color: var(--cn-gold);\n  letter-spacing: var(--cn-tracking-tight);\n}\n\n.cn-h1 {\n  font-family: var(--cn-font-display);\n  font-size: var(--cn-size-h1);\n  font-weight: var(--cn-w-bold);\n  line-height: var(--cn-lh-snug);\n  color: var(--cn-fg1);\n  letter-spacing: var(--cn-tracking-tight);\n}\n\n.cn-h2 {\n  font-family: var(--cn-font-display);\n  font-size: var(--cn-size-h2);\n  font-weight: var(--cn-w-bold);\n  line-height: var(--cn-lh-snug);\n  color: var(--cn-fg1);\n}\n\n.cn-h3 {\n  font-family: var(--cn-font-display);\n  font-size: var(--cn-size-h3);\n  font-weight: var(--cn-w-bold);\n  line-height: var(--cn-lh-snug);\n  color: var(--cn-gold);\n}\n\n.cn-lead {\n  font-family: var(--cn-font-body);\n  font-size: var(--cn-size-lead);\n  font-weight: var(--cn-w-regular);\n  line-height: var(--cn-lh-loose);\n  color: var(--cn-fg2);\n  font-style: italic;\n}\n\n.cn-body {\n  font-family: var(--cn-font-body);\n  font-size: var(--cn-size-body);\n  font-weight: var(--cn-w-regular);\n  line-height: var(--cn-lh-loose);\n  color: var(--cn-fg2);\n}\n\n.cn-small {\n  font-family: var(--cn-font-body);\n  font-size: var(--cn-size-small);\n  line-height: var(--cn-lh-normal);\n  color: var(--cn-fg3);\n}\n\n.cn-label {\n  font-family: var(--cn-font-display);\n  font-size: var(--cn-size-caption);\n  font-weight: var(--cn-w-semibold);\n  letter-spacing: var(--cn-tracking-label);\n  text-transform: uppercase;\n  color: var(--cn-gold);\n}\n\n.cn-italic {\n  font-style: italic;\n  font-weight: inherit;\n}\n\n/* The signature outlined kicker pill — gold hairline rectangle, tracked all-caps label */\n.cn-pill {\n  display: inline-block;\n  padding: 8px 18px;\n  border: var(--cn-border-gold);\n  color: var(--cn-gold);\n  font-family: var(--cn-font-display);\n  font-size: 11px;\n  font-weight: var(--cn-w-semibold);\n  letter-spacing: var(--cn-tracking-label);\n  text-transform: uppercase;\n  border-radius: var(--cn-radius-0);\n}\n\n/* The signature flat dark card */\n.cn-card {\n  background: var(--cn-surface);\n  color: var(--cn-fg);\n  padding: var(--cn-space-7);\n  border: 0;\n  border-radius: var(--cn-radius-0);\n  box-shadow: var(--cn-shadow-none);\n}\n<\u002Fstyle>\n<script src=\"d802ce5d-015c-49ec-aafa-329c76e789a7\"><\u002Fscript>\n<style>\n  html, body { margin:0; padding:0; background:#F4F5F3; }\n  body { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; font-synthesis:none; }\n  input, select, textarea, button { -webkit-font-smoothing:antialiased; }\n  * { box-sizing:border-box; }\n  a { color:#14556B; text-decoration:none; border-bottom:1px solid rgba(20,85,107,0.5); }\n  a:hover { color:#101418; border-bottom-color:#101418; }\n  input, select, textarea, button { font-family:'Cardo', Georgia, serif; }\n  input::placeholder, textarea::placeholder { color:#55606A; }\n  ::selection { background:rgba(20,85,107,0.18); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"background:#F4F5F3; color:#101418; font-family:'Cardo', Georgia, serif; font-size:17px; line-height:1.6; min-height:100vh; padding:0 0 120px 0;\">\n\n  <div style=\"border-bottom:1px solid #DDE1E1; background:#FFFFFF;\">\n    <div style=\"max-width:1440px; margin:0 auto; padding:44px 40px 36px 40px;\">\n      <div style=\"display:flex; justify-content:space-between; align-items:flex-start; gap:48px; flex-wrap:wrap;\">\n        <div style=\"max-width:700px;\">\n          <span style=\"display:inline-block; padding:7px 16px; border:1px solid #14556B; color:#14556B; font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase;\">Offtake Desk<\u002Fspan>\n          <h1 style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:52px; font-weight:700; line-height:1.08; letter-spacing:-0.01em; color:#101418; margin:22px 0 0 0;\">Capacity You Can Place <em style=\"font-style:italic; color:#14556B;\">This Year<\u002Fem><\u002Fh1>\n          <p style=\"font-size:18px; line-height:1.65; color:#3E4A50; margin:16px 0 0 0; max-width:620px; text-wrap:pretty;\">Every row carries a megawatt figure an operator or their broker put in writing, and the date they wrote it. Nothing in construction. Nothing that will not be live inside six months.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"min-width:280px;\">\n          <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:#14556B;\">Acting As<\u002Fdiv>\n          <sc-raw-select value=\"{{ rep }}\" sc-camel-on-change=\"{{ onRep }}\" style=\"margin-top:10px; width:100%; background:#FFFFFF; border:1px solid #14556B; color:#101418; font-size:18px; padding:11px 12px; border-radius:0; outline:none;\">\n            <sc-for list=\"{{ repList }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <option value=\"{{ r }}\">{{ r }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <div style=\"font-size:16px; color:#55606A; line-height:1.5; margin-top:10px;\">Stage changes and log entries are stamped with this name. Set the team in Tweaks as <em style=\"font-style:italic;\">Name &lt;name@company.com&gt;<\u002Fem>.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; gap:44px; margin-top:32px; flex-wrap:wrap;\">\n        <div><div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:34px; font-weight:700; color:#101418; line-height:1;\">{{ tierACount }}<\u002Fdiv><div style=\"font-size:14px; letter-spacing:0.1em; text-transform:uppercase; color:#55606A; margin-top:5px;\">Published available<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:34px; font-weight:700; color:#101418; line-height:1;\">{{ tierBCount }}<\u002Fdiv><div style=\"font-size:14px; letter-spacing:0.1em; text-transform:uppercase; color:#55606A; margin-top:5px;\">Uncommitted inventory<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:34px; font-weight:700; color:#14556B; line-height:1;\">{{ myCount }}<\u002Fdiv><div style=\"font-size:14px; letter-spacing:0.1em; text-transform:uppercase; color:#55606A; margin-top:5px;\">Assigned to you<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:34px; font-weight:700; color:#101418; line-height:1;\">{{ inPlayCount }}<\u002Fdiv><div style=\"font-size:14px; letter-spacing:0.1em; text-transform:uppercase; color:#55606A; margin-top:5px;\">Contacted or in talks<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:34px; font-weight:700; color:#101418; line-height:1;\">{{ untouchedCount }}<\u002Fdiv><div style=\"font-size:14px; letter-spacing:0.1em; text-transform:uppercase; color:#55606A; margin-top:5px;\">Never touched<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:sticky; top:0; z-index:20; background:#FFFFFF; border-bottom:1px solid #DDE1E1;\">\n    <div style=\"max-width:1440px; margin:0 auto; padding:0 40px; display:flex; gap:4px; flex-wrap:wrap;\">\n      <div sc-camel-on-click=\"{{ viewTable }}\" style=\"{{ tabTableStyle }}\">The Desk<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ viewBoard }}\" style=\"{{ tabBoardStyle }}\">Pipeline<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ viewToday }}\" style=\"{{ tabTodayStyle }}\">My Day<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ viewInbox }}\" style=\"{{ tabInboxStyle }}\">My Assignments {{ inboxBadge }}<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ viewBridge }}\" style=\"{{ tabBridgeStyle }}\">CRM Bridge {{ queueBadge }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1440px; margin:0 auto; padding:0 40px;\">\n\n    <sc-if value=\"{{ isTable }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:24px 0;\">\n          <input type=\"text\" placeholder=\"Search operator, site, market, power…\" value=\"{{ q }}\" sc-camel-on-change=\"{{ onQuery }}\" style=\"flex:1 1 260px; min-width:220px; background:#FFFFFF; border:1px solid #B6BDBE; color:#101418; font-size:17px; padding:11px 14px; border-radius:0; outline:none;\">\n          <sc-raw-select value=\"{{ tierF }}\" sc-camel-on-change=\"{{ onTier }}\" style=\"background:#FFFFFF; border:1px solid #B6BDBE; color:#101418; font-size:17px; padding:11px 14px; border-radius:0; outline:none;\">\n            <option value=\"all\">Both tiers<\u002Foption>\n            <option value=\"A\">Tier A — published available<\u002Foption>\n            <option value=\"B\">Tier B — uncommitted inventory<\u002Foption>\n          <\u002Fsc-raw-select>\n          <sc-raw-select value=\"{{ region }}\" sc-camel-on-change=\"{{ onRegion }}\" style=\"background:#FFFFFF; border:1px solid #B6BDBE; color:#101418; font-size:17px; padding:11px 14px; border-radius:0; outline:none;\">\n            <option value=\"all\">All regions<\u002Foption>\n            <option value=\"North America\">North America<\u002Foption>\n            <option value=\"EMEA\">EMEA<\u002Foption>\n            <option value=\"APAC\">APAC<\u002Foption>\n          <\u002Fsc-raw-select>\n          <sc-raw-select value=\"{{ stageF }}\" sc-camel-on-change=\"{{ onStage }}\" style=\"background:#FFFFFF; border:1px solid #B6BDBE; color:#101418; font-size:17px; padding:11px 14px; border-radius:0; outline:none;\">\n            <option value=\"all\">Any build stage<\u002Foption>\n            <option value=\"Live\">Live<\u002Foption>\n            <option value=\"Live + pre-leasing\">Live + pre-leasing<\u002Foption>\n            <option value=\"Pre-leasing\">Pre-leasing<\u002Foption>\n            <option value=\"Powered shell\">Powered shell<\u002Foption>\n          <\u002Fsc-raw-select>\n          <sc-raw-select value=\"{{ owner }}\" sc-camel-on-change=\"{{ onOwner }}\" style=\"background:#FFFFFF; border:1px solid #B6BDBE; color:#101418; font-size:17px; padding:11px 14px; border-radius:0; outline:none;\">\n            <option value=\"all\">Any owner<\u002Foption>\n            <option value=\"mine\">Assigned to me<\u002Foption>\n            <option value=\"unassigned\">Unassigned<\u002Foption>\n          <\u002Fsc-raw-select>\n          <sc-raw-select value=\"{{ statusF }}\" sc-camel-on-change=\"{{ onStatus }}\" style=\"background:#FFFFFF; border:1px solid #B6BDBE; color:#101418; font-size:17px; padding:11px 14px; border-radius:0; outline:none;\">\n            <option value=\"all\">Any stage<\u002Foption>\n            <option value=\"New\">New<\u002Foption>\n            <option value=\"Researching\">Researching<\u002Foption>\n            <option value=\"Contacted\">Contacted<\u002Foption>\n            <option value=\"In talks\">In talks<\u002Foption>\n            <option value=\"Won\">Won<\u002Foption>\n            <option value=\"Passed\">Passed<\u002Foption>\n          <\u002Fsc-raw-select>\n          <button sc-camel-on-click=\"{{ toggleBookFit }}\" style=\"{{ bookFitStyle }}\">10–100 MW only<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toggleCertOnly }}\" style=\"{{ certOnlyStyle }}\">Published tier only<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ resetFilters }}\" style=\"background:#FFFFFF; border:1px solid #B6BDBE; color:#3E4A50; font-size:16px; padding:11px 16px; border-radius:0; cursor:pointer;\">Reset<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #DDE1E1; background:#FFFFFF;\">\n          <div style=\"display:grid; grid-template-columns:88px 78px 2.4fr 1.2fr 1.25fr 1.05fr 1fr 1.15fr 1.15fr; gap:14px; padding:15px 20px; background:#ECEFEF; border-bottom:1px solid #DDE1E1; font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#55606A;\">\n            <div>Tier<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ sortByScore }}\" style=\"cursor:pointer; color:#14556B;\">Fit<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ sortByName }}\" style=\"cursor:pointer; color:#14556B;\">Site &amp; operator<\u002Fdiv>\n            <div>Market<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ sortByMW }}\" style=\"cursor:pointer; color:#14556B;\">Available<\u002Fdiv>\n            <div>Stage<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ sortByStale }}\" style=\"cursor:pointer; color:#14556B;\">Published<\u002Fdiv>\n            <div>Owner<\u002Fdiv>\n            <div>CRM stage<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"10\">\n            <div style=\"display:grid; grid-template-columns:88px 78px 2.4fr 1.2fr 1.25fr 1.05fr 1fr 1.15fr 1.15fr; gap:14px; padding:20px; border-bottom:1px solid #E9ECEC; align-items:center;\" style-hover=\"background:#F6F9F9;\">\n              <div sc-camel-on-click=\"{{ r.open }}\" style=\"{{ r.tierStyle }}\">{{ r.tierLabel }}<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ r.open }}\" style=\"cursor:pointer;\">\n                <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:28px; font-weight:700; color:#101418; line-height:1;\">{{ r.score }}<\u002Fdiv>\n                <div style=\"font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:#55606A; margin-top:4px;\">{{ r.bookTag }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ r.open }}\" style=\"cursor:pointer;\">\n                <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:22px; font-weight:700; color:#101418; line-height:1.25;\">{{ r.site }}<\u002Fdiv>\n                <div style=\"font-size:16px; color:#3E4A50; margin-top:3px;\">{{ r.op }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ r.open }}\" style=\"cursor:pointer; font-size:17px; color:#101418;\">{{ r.mkt }}<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ r.open }}\" style=\"cursor:pointer;\">\n                <div style=\"font-size:17px; font-weight:700; color:#14556B;\">{{ r.avShort }}<\u002Fdiv>\n                <div style=\"font-size:14px; color:#55606A; margin-top:3px; line-height:1.35;\">{{ r.scaleShort }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ r.open }}\" style=\"cursor:pointer; font-size:16px; color:#3E4A50;\">{{ r.stage }}<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ r.open }}\" style=\"cursor:pointer;\">\n                <div style=\"font-size:16px; color:#101418;\">{{ r.pubDate }}<\u002Fdiv>\n                <div style=\"{{ r.staleStyle }}\">{{ r.staleLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <sc-raw-select value=\"{{ r.ownerVal }}\" sc-camel-on-change=\"{{ r.onOwner }}\" style=\"{{ r.ownerStyle }}\">\n                  <option value=\"\">Unassigned<\u002Foption>\n                  <sc-for list=\"{{ repList }}\" as=\"p\" hint-placeholder-count=\"3\">\n                    <option value=\"{{ p }}\">{{ p }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div>\n                <sc-raw-select value=\"{{ r.status }}\" sc-camel-on-change=\"{{ r.onStatus }}\" style=\"{{ r.statusStyle }}\">\n                  <option value=\"New\">New<\u002Foption>\n                  <option value=\"Researching\">Researching<\u002Foption>\n                  <option value=\"Contacted\">Contacted<\u002Foption>\n                  <option value=\"In talks\">In talks<\u002Foption>\n                  <option value=\"Won\">Won<\u002Foption>\n                  <option value=\"Passed\">Passed<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:56px 20px; text-align:center; font-size:18px; font-style:italic; color:#55606A;\">Nothing matches. Widen the filters or reset.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"font-size:16px; color:#55606A; margin-top:14px;\">Click any row to open the full record — power, contact path, checklist, assignment and log. Click a column heading to sort.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isBoard }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid; grid-template-columns:repeat(6, minmax(190px, 1fr)); gap:16px; margin-top:28px; align-items:start;\">\n        <sc-for list=\"{{ board }}\" as=\"col\" hint-placeholder-count=\"6\">\n          <div style=\"border:1px solid #DDE1E1; background:#FFFFFF; min-height:180px;\">\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; padding:14px 16px; background:#ECEFEF; border-bottom:1px solid #DDE1E1;\">\n              <span style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:#55606A;\">{{ col.name }}<\u002Fspan>\n              <span style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:20px; font-weight:700; color:#101418;\">{{ col.count }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid; gap:1px; background:#E9ECEC;\">\n              <sc-for list=\"{{ col.items }}\" as=\"c\" hint-placeholder-count=\"2\">\n                <div sc-camel-on-click=\"{{ c.open }}\" style=\"background:#FFFFFF; padding:16px; cursor:pointer;\" style-hover=\"background:#F6F9F9;\">\n                  <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:18px; font-weight:700; color:#101418; line-height:1.3;\">{{ c.site }}<\u002Fdiv>\n                  <div style=\"font-size:15px; color:#3E4A50; margin-top:4px;\">{{ c.op }}<\u002Fdiv>\n                  <div style=\"font-size:15px; color:#14556B; margin-top:10px;\">{{ c.avShort }} · {{ c.mkt }}<\u002Fdiv>\n                  <div style=\"font-size:13px; color:#55606A; margin-top:8px; letter-spacing:0.06em; text-transform:uppercase;\">{{ c.ownerLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isToday }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:28px;\">\n        <p style=\"font-size:17px; color:#3E4A50; line-height:1.65; max-width:640px; margin:0 0 24px 0;\">Ordered by neglect. Untouched Tier A first, then whatever has gone longest without a logged call. Yours sits at the top.<\u002Fp>\n        <div style=\"border:1px solid #DDE1E1; background:#FFFFFF;\">\n          <sc-for list=\"{{ today }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ t.open }}\" style=\"display:grid; grid-template-columns:88px 2.4fr 1.2fr 1.1fr 1.3fr 1.2fr; gap:16px; padding:20px; border-bottom:1px solid #E9ECEC; align-items:center; cursor:pointer;\" style-hover=\"background:#F6F9F9;\">\n              <div style=\"{{ t.tierStyle }}\">{{ t.tierLabel }}<\u002Fdiv>\n              <div>\n                <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:22px; font-weight:700; color:#101418; line-height:1.25;\">{{ t.site }}<\u002Fdiv>\n                <div style=\"font-size:16px; color:#3E4A50; margin-top:3px;\">{{ t.op }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:17px; font-weight:700; color:#14556B;\">{{ t.avShort }}<\u002Fdiv>\n              <div style=\"font-size:17px; color:#101418;\">{{ t.mkt }}<\u002Fdiv>\n              <div style=\"font-size:16px; color:#55606A;\">{{ t.touchLabel }}<\u002Fdiv>\n              <div style=\"font-size:16px; color:#3E4A50;\">{{ t.status }} · {{ t.ownerLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isInbox }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:28px;\">\n        <p style=\"font-size:17px; color:#3E4A50; line-height:1.65; max-width:660px; margin:0 0 24px 0;\">Everything assigned to {{ rep }}. Unacknowledged first. Acknowledge it, then work the checklist — the seven answers that turn a published megawatt figure into a placeable deal.<\u002Fp>\n        <div style=\"display:grid; gap:16px;\">\n          <sc-for list=\"{{ inbox }}\" as=\"i\" hint-placeholder-count=\"3\">\n            <div style=\"border:1px solid #DDE1E1; background:#FFFFFF; padding:24px;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap;\">\n                <div style=\"flex:1 1 420px;\">\n                  <div style=\"display:flex; gap:10px; align-items:center; flex-wrap:wrap;\">\n                    <span style=\"{{ i.ackStyle }}\">{{ i.ackLabel }}<\u002Fspan>\n                    <span style=\"{{ i.tierStyle }}\">{{ i.tierLabel }}<\u002Fspan>\n                    <span style=\"font-size:14px; letter-spacing:0.06em; text-transform:uppercase; color:#55606A;\">{{ i.assignLine }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ i.open }}\" style=\"cursor:pointer; font-family:'Cormorant Garamond', Garamond, serif; font-size:28px; font-weight:700; color:#101418; line-height:1.2; margin-top:12px;\">{{ i.site }}<\u002Fdiv>\n                  <div style=\"font-size:17px; color:#3E4A50; margin-top:4px;\">{{ i.op }} · {{ i.mkt }} · {{ i.avShort }}<\u002Fdiv>\n                  <sc-if value=\"{{ i.hasBrief }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"border-left:2px solid #14556B; padding:4px 0 4px 16px; margin-top:16px; max-width:640px;\">\n                      <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#14556B;\">Instructions<\u002Fdiv>\n                      <div style=\"font-size:17px; color:#101418; line-height:1.6; margin-top:6px; white-space:pre-wrap;\">{{ i.brief }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"min-width:250px; display:grid; gap:12px;\">\n                  <div style=\"font-size:16px; color:#3E4A50;\">Checklist — {{ i.checkLabel }}<\u002Fdiv>\n                  <div style=\"height:3px; background:#E9ECEC;\"><div style=\"{{ i.checkBarStyle }}\"><\u002Fdiv><\u002Fdiv>\n                  <a href=\"{{ i.chUrl }}\" target=\"_blank\" style=\"font-size:17px;\">Leasing page<\u002Fa>\n                  <a href=\"{{ i.li }}\" target=\"_blank\" style=\"font-size:17px;\">LinkedIn people search<\u002Fa>\n                  <div style=\"display:flex; gap:10px; flex-wrap:wrap;\">\n                    <sc-if value=\"{{ i.needsAck }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button sc-camel-on-click=\"{{ i.ack }}\" style=\"background:#14556B; border:1px solid #14556B; color:#FFFFFF; font-size:15px; padding:10px 16px; border-radius:0; cursor:pointer; letter-spacing:0.06em; text-transform:uppercase;\">Acknowledge<\u002Fbutton>\n                    <\u002Fsc-if>\n                    <button sc-camel-on-click=\"{{ i.open }}\" style=\"background:#FFFFFF; border:1px solid #14556B; color:#14556B; font-size:15px; padding:10px 16px; border-radius:0; cursor:pointer; letter-spacing:0.06em; text-transform:uppercase;\">Open record<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ inboxEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:56px 0; text-align:center; font-size:18px; font-style:italic; color:#55606A;\">Nothing assigned to {{ rep }} yet. A manager assigns leads from the record panel on any row.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isBridge }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:28px;\">\n        <div style=\"border:1px solid #14556B; padding:24px;\">\n          <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#14556B;\">Connection Status<\u002Fdiv>\n          <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:26px; font-weight:700; color:#101418; margin-top:10px;\">{{ crmStatus }}<\u002Fdiv>\n          <p style=\"font-size:17px; color:#3E4A50; line-height:1.7; margin:12px 0 0 0; max-width:840px; text-wrap:pretty;\">You already run Supabase behind the CRM, which is the whole backend this needs. Run <strong>Supabase Setup.sql<\u002Fstrong> from this project in the Supabase SQL editor — it creates the seven tables and one function, <em style=\"font-style:italic;\">offtake_upsert<\u002Fem>, that takes a whole record in a single call. Then paste your project URL and anon key into Tweaks and these pushes go live: accounts matched on operator name, notes carried across with author and timestamp, checklist items landing as tasks. Re-pushing the same record updates it and never duplicates the log.<\u002Fp>\n          <div style=\"display:grid; grid-template-columns:190px 1fr; gap:16px; margin-top:20px; align-items:baseline;\">\n            <div style=\"font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#55606A;\">Endpoint<\u002Fdiv>\n            <div style=\"font-size:17px; color:#101418;\">{{ crmEndpoint }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:190px 1fr; gap:16px; margin-top:10px; align-items:baseline;\">\n            <div style=\"font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#55606A;\">Authentication<\u002Fdiv>\n            <div style=\"font-size:17px; color:#101418;\">OAuth, authorisation code with PKCE — no shared key in this file. Each rep's token carries their own name, so Dan's notes arrive as Dan's activity.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:190px 1fr; gap:16px; margin-top:10px; align-items:baseline;\">\n            <div style=\"font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#55606A;\">Duplicate rule<\u002Fdiv>\n            <div style=\"font-size:17px; color:#101418;\">Accounts match on operator name. The five Sabey sites land under one Sabey account.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; margin-top:40px;\">\n          <div>\n            <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#14556B;\">Outbound Queue<\u002Fdiv>\n            <h2 style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:32px; font-weight:700; color:#101418; margin:10px 0 0 0;\">{{ queueCount }} activity<\u002Fh2>\n            <p style=\"font-size:17px; color:#3E4A50; line-height:1.65; margin:8px 0 0 0; max-width:660px;\">A record enters the queue when it is assigned, when its stage moves past New, or when the first note is logged. Untouched research never reaches the CRM.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:10px; flex-wrap:wrap;\">\n            <sc-if value=\"{{ sbReady }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ pushAll }}\" style=\"background:#14556B; border:1px solid #14556B; color:#FFFFFF; font-size:16px; padding:12px 20px; border-radius:0; cursor:pointer; letter-spacing:0.06em; text-transform:uppercase;\">{{ pushAllLabel }}<\u002Fbutton>\n            <\u002Fsc-if>\n            <button sc-camel-on-click=\"{{ copyQueue }}\" style=\"background:#FFFFFF; border:1px solid #14556B; color:#14556B; font-size:16px; padding:12px 20px; border-radius:0; cursor:pointer; letter-spacing:0.06em; text-transform:uppercase;\">{{ copyQueueLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ downloadQueue }}\" style=\"background:#FFFFFF; border:1px solid #14556B; color:#14556B; font-size:16px; padding:12px 20px; border-radius:0; cursor:pointer; letter-spacing:0.06em; text-transform:uppercase;\">Download JSON<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #DDE1E1; background:#FFFFFF; margin-top:20px;\">\n          <sc-for list=\"{{ queue }}\" as=\"qi\" hint-placeholder-count=\"2\">\n            <div style=\"padding:20px; border-bottom:1px solid #E9ECEC;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap;\">\n                <div>\n                  <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:22px; font-weight:700; color:#101418; line-height:1.25;\">{{ qi.site }}<\u002Fdiv>\n                  <div style=\"font-size:16px; color:#3E4A50; margin-top:3px;\">{{ qi.op }} · {{ qi.mkt }}<\u002Fdiv>\n                  <div style=\"font-size:16px; color:#55606A; margin-top:8px;\">{{ qi.reasonLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex; gap:10px; align-items:center; flex-wrap:wrap;\">\n                  <span style=\"font-size:16px; color:#55606A;\">{{ qi.pushLabel }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ qi.copyOne }}\" style=\"background:#FFFFFF; border:1px solid #14556B; color:#14556B; font-size:15px; padding:10px 16px; border-radius:0; cursor:pointer; letter-spacing:0.06em; text-transform:uppercase;\">Copy payload<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ qi.push }}\" style=\"background:#14556B; border:1px solid #14556B; color:#FFFFFF; font-size:15px; padding:10px 16px; border-radius:0; cursor:pointer; letter-spacing:0.06em; text-transform:uppercase;\">{{ qi.pushBtnLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ qi.hasError }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border-left:3px solid #14556B; padding:8px 0 8px 14px; margin-top:12px; font-size:16px; color:#101418; line-height:1.6;\">{{ qi.errorText }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ queueEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:56px 20px; text-align:center; font-size:18px; font-style:italic; color:#55606A;\">Nothing has activity yet. Assign a lead, move a stage, or log a note and it appears here.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"font-size:16px; color:#55606A; margin-top:14px;\">Setup SQL is in <strong>Supabase Setup.sql<\u002Fstrong>; the object model and payload contract are in <strong>CRM API Spec.md<\u002Fstrong>. The anon key is safe to paste here — row level security is on and the desk writes only through the function, never the tables.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <section style=\"padding:72px 0 0 0;\">\n      <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:#14556B;\">The Rules Of This Desk<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:28px; margin-top:24px;\">\n        <div style=\"border-top:2px solid #14556B; padding-top:20px;\">\n          <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:22px; font-weight:700; color:#101418;\">Tier A — published available<\u002Fdiv>\n          <p style=\"font-size:17px; color:#3E4A50; line-height:1.7; margin:10px 0 0 0;\">The operator or their appointed broker stated a specific megawatt figure as leasable now or open to pre-lease. Lead with their number and their date. Ask what has been absorbed since — the answer qualifies the deal in one question.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #DDE1E1; padding-top:20px;\">\n          <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:22px; font-weight:700; color:#101418;\">Tier B — uncommitted inventory<\u002Fdiv>\n          <p style=\"font-size:17px; color:#3E4A50; line-height:1.7; margin:10px 0 0 0;\">A live, operating building where a specific megawatt figure is public and no anchor tenant has been named on the open block. Most publish campus scale rather than an available block, so the available column reads Not published — that is the first question on the call.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #DDE1E1; padding-top:20px;\">\n          <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:22px; font-weight:700; color:#101418;\">What was cut, and why<\u002Fdiv>\n          <p style=\"font-size:17px; color:#3E4A50; line-height:1.7; margin:10px 0 0 0;\">Announcements missing land, permits or interconnection. Anything still under construction. Anything whose power does not go live inside six months — which removed every 2027 and 2028 phase, including Sabey Umatilla and Austin. India, entirely. Fully committed campuses — which is why Merlin Edged Madrid and Barcelona are absent, leased to Meta and CoreWeave respectively. New Zealand returned nothing that clears the bar: 154 MW of colocation built nationally, no operator publishing an available block, and NEXTDC AK1 Auckland still in planning as of February 2026. Two near misses worth watching — NxN Madrid, 7.5 MW live from September 2026, and Start Campus SIN02, 180 MW — are both builds today. Any operator without an operating track record — that is how tier screening was applied, since per-building tier ratings are rarely published.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #14556B; padding:24px; margin-top:28px;\">\n        <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:#14556B;\">Two Working Limits — Read Them<\u002Fdiv>\n        <p style=\"font-size:17px; color:#101418; line-height:1.7; margin:10px 0 0 0; max-width:900px; text-wrap:pretty;\">Your pipeline saves to the browser this file is open in. Two reps on two machines will not see each other's log — this desk is the research and dial layer, your own CRM stays the system of record. And every megawatt figure here is dated: the oldest are nine months old and several will already be gone. The published date is on every row for exactly that reason. Refresh monthly.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ sel }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; background:rgba(16,20,24,0.42); z-index:40;\" sc-camel-on-click=\"{{ close }}\"><\u002Fdiv>\n    <aside style=\"position:fixed; top:0; right:0; bottom:0; width:min(720px, 100vw); background:#FFFFFF; border-left:1px solid #14556B; z-index:41; overflow-y:auto; padding:36px 44px 96px 44px;\">\n      <div style=\"display:flex; justify-content:space-between; align-items:flex-start; gap:24px;\">\n        <div>\n          <span style=\"display:inline-block; padding:6px 14px; border:1px solid #14556B; color:#14556B; font-family:'Cormorant Garamond', Garamond, serif; font-size:10px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase;\">{{ sel.tierLabel }} · Fit {{ sel.score }} · {{ sel.bookTag }}<\u002Fspan>\n          <h3 style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:38px; font-weight:700; line-height:1.15; color:#101418; margin:16px 0 0 0;\">{{ sel.site }}<\u002Fh3>\n          <div style=\"font-size:17px; color:#3E4A50; margin-top:6px;\">{{ sel.op }} · {{ sel.mkt }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ close }}\" style=\"background:#FFFFFF; border:1px solid #B6BDBE; color:#3E4A50; font-size:20px; line-height:1; padding:8px 14px; cursor:pointer; border-radius:0;\">×<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"border-left:3px solid #14556B; padding:6px 0 6px 20px; margin-top:26px;\">\n        <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#14556B;\">The Number, And When They Published It<\u002Fdiv>\n        <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:28px; font-weight:700; color:#101418; line-height:1.25; margin-top:10px;\">{{ sel.av }}<\u002Fdiv>\n        <div style=\"font-size:17px; color:#3E4A50; margin-top:6px;\">Published {{ sel.pubDate }} · {{ sel.staleLabel }}<\u002Fdiv>\n        <div style=\"font-size:16px; color:#55606A; margin-top:4px;\">Campus scale — {{ sel.scaleShort }}<\u002Fdiv>\n        <p style=\"font-size:17px; color:#101418; line-height:1.7; margin:14px 0 0 0; text-wrap:pretty;\">{{ sel.why }}<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #14556B; padding:20px; margin-top:26px;\">\n        <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#14556B;\">Add A Note<\u002Fdiv>\n        <textarea placeholder=\"What was said, who said it, what happens next…\" value=\"{{ draft }}\" sc-camel-on-change=\"{{ onDraft }}\" style=\"width:100%; min-height:96px; margin-top:12px; background:#FFFFFF; border:1px solid #B6BDBE; color:#101418; font-size:17px; line-height:1.6; padding:12px; border-radius:0; outline:none; resize:vertical;\"><\u002Ftextarea>\n        <div style=\"display:flex; gap:12px; align-items:center; margin-top:12px; flex-wrap:wrap;\">\n          <button sc-camel-on-click=\"{{ addLog }}\" style=\"background:#14556B; border:1px solid #14556B; color:#FFFFFF; font-size:16px; padding:11px 20px; border-radius:0; cursor:pointer; letter-spacing:0.06em; text-transform:uppercase;\">Save note as {{ rep }}<\u002Fbutton>\n          <span style=\"font-size:16px; color:#55606A;\">{{ sel.logCountLabel }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:28px; border-top:1px solid #DDE1E1;\">\n        <sc-for list=\"{{ sel.fields }}\" as=\"f\" hint-placeholder-count=\"6\">\n          <div style=\"display:grid; grid-template-columns:170px 1fr; gap:20px; padding:14px 0; border-bottom:1px solid #E9ECEC; align-items:baseline;\">\n            <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#14556B;\">{{ f.k }}<\u002Fdiv>\n            <div style=\"font-size:17px; color:#101418; line-height:1.6;\">{{ f.v }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:32px;\">\n        <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#14556B;\">Path To A Human<\u002Fdiv>\n        <div style=\"border:1px solid #DDE1E1; padding:20px; margin-top:12px; display:grid; gap:14px;\">\n          <div style=\"display:grid; grid-template-columns:150px 1fr; gap:16px; align-items:baseline;\">\n            <div style=\"font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#55606A;\">Leasing page<\u002Fdiv>\n            <div style=\"font-size:17px;\"><a href=\"{{ sel.chUrl }}\" target=\"_blank\">{{ sel.chLabel }}<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:150px 1fr; gap:16px; align-items:baseline;\">\n            <div style=\"font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#55606A;\">Phone<\u002Fdiv>\n            <div style=\"font-size:17px; color:#101418;\">{{ sel.phone }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:150px 1fr; gap:16px; align-items:baseline;\">\n            <div style=\"font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#55606A;\">Who to ask for<\u002Fdiv>\n            <div style=\"font-size:17px; color:#101418; line-height:1.6;\">{{ sel.roles }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:150px 1fr; gap:16px; align-items:baseline;\">\n            <div style=\"font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#55606A;\">Find them<\u002Fdiv>\n            <div style=\"font-size:17px;\"><a href=\"{{ sel.li }}\" target=\"_blank\">LinkedIn people search — {{ sel.op }}<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:32px;\">\n        <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#14556B;\">Deal Record<\u002Fdiv>\n        <div style=\"display:grid; gap:14px; margin-top:12px;\">\n          <div style=\"display:grid; grid-template-columns:130px 1fr; gap:16px; align-items:baseline;\">\n            <div style=\"font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#55606A;\">Assigned to<\u002Fdiv>\n            <div style=\"font-size:17px; color:#101418;\">{{ sel.assignState }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:130px 1fr; gap:16px; align-items:center;\">\n            <div style=\"font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#55606A;\">Stage<\u002Fdiv>\n            <sc-raw-select value=\"{{ sel.status }}\" sc-camel-on-change=\"{{ sel.onStatus }}\" style=\"background:#FFFFFF; border:1px solid #14556B; color:#101418; font-size:17px; padding:10px 12px; border-radius:0; outline:none;\">\n              <option value=\"New\">New<\u002Foption>\n              <option value=\"Researching\">Researching<\u002Foption>\n              <option value=\"Contacted\">Contacted<\u002Foption>\n              <option value=\"In talks\">In talks<\u002Foption>\n              <option value=\"Won\">Won<\u002Foption>\n              <option value=\"Passed\">Passed<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:130px 1fr; gap:16px; align-items:center;\">\n            <div style=\"font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#55606A;\">Matched to<\u002Fdiv>\n            <input type=\"text\" placeholder=\"Which of your neoclouds this is for…\" value=\"{{ sel.matched }}\" sc-camel-on-change=\"{{ sel.onMatched }}\" style=\"background:#FFFFFF; border:1px solid #B6BDBE; color:#101418; font-size:17px; padding:10px 12px; border-radius:0; outline:none; width:100%;\">\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:130px 1fr; gap:16px; align-items:baseline;\">\n            <div style=\"font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#55606A;\">Last touched<\u002Fdiv>\n            <div style=\"font-size:17px; color:#101418;\">{{ sel.touchLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:32px;\">\n        <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#14556B;\">Assign This Lead<\u002Fdiv>\n        <div style=\"border:1px solid #DDE1E1; padding:20px; margin-top:12px;\">\n          <div style=\"display:grid; grid-template-columns:130px 1fr; gap:16px; align-items:center;\">\n            <div style=\"font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#55606A;\">Rep<\u002Fdiv>\n            <sc-raw-select value=\"{{ assignTo }}\" sc-camel-on-change=\"{{ onAssignTo }}\" style=\"background:#FFFFFF; border:1px solid #B6BDBE; color:#101418; font-size:17px; padding:10px 12px; border-radius:0; outline:none; width:100%;\">\n              <option value=\"\">Choose a rep…<\u002Foption>\n              <sc-for list=\"{{ repList }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <option value=\"{{ p }}\">{{ p }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <textarea placeholder=\"What you want them to come back with, and by when…\" value=\"{{ assignBrief }}\" sc-camel-on-change=\"{{ onAssignBrief }}\" style=\"width:100%; min-height:90px; margin-top:14px; background:#FFFFFF; border:1px solid #B6BDBE; color:#101418; font-size:17px; line-height:1.6; padding:12px; border-radius:0; outline:none; resize:vertical;\"><\u002Ftextarea>\n          <div style=\"display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; align-items:center;\">\n            <button sc-camel-on-click=\"{{ assign }}\" style=\"background:#14556B; border:1px solid #14556B; color:#FFFFFF; font-size:16px; padding:11px 20px; border-radius:0; cursor:pointer; letter-spacing:0.06em; text-transform:uppercase;\">Assign<\u002Fbutton>\n            <a href=\"{{ sel.notifyMailto }}\" style=\"border:1px solid #14556B; color:#14556B; font-size:16px; padding:11px 20px; letter-spacing:0.06em; text-transform:uppercase;\">Send the brief by email<\u002Fa>\n            <button sc-camel-on-click=\"{{ copyBrief }}\" style=\"background:#FFFFFF; border:1px solid #B6BDBE; color:#3E4A50; font-size:16px; padding:11px 20px; border-radius:0; cursor:pointer; letter-spacing:0.06em; text-transform:uppercase;\">{{ copyBriefLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:16px; color:#55606A; line-height:1.6; margin-top:12px;\">Assigning writes the owner, the brief and a timestamp to the record, and drops it into that rep's My Assignments tab. The email button opens your mail client with the whole brief already written — that is the notification, since this desk has no server of its own. It addresses the rep automatically once their team entry reads <em style=\"font-style:italic;\">Name &lt;name@company.com&gt;<\u002Fem> in Tweaks. Placeholder addresses ship by default — replace them.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:32px;\">\n        <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#14556B;\">Qualification Checklist — {{ sel.checkLabel }}<\u002Fdiv>\n        <div style=\"border-top:1px solid #DDE1E1; margin-top:12px;\">\n          <sc-for list=\"{{ sel.checks }}\" as=\"c\" hint-placeholder-count=\"7\">\n            <div sc-camel-on-click=\"{{ c.toggle }}\" style=\"display:grid; grid-template-columns:32px 1fr; gap:14px; padding:14px 0; border-bottom:1px solid #E9ECEC; cursor:pointer; align-items:baseline;\" style-hover=\"background:#F6F9F9;\">\n              <div style=\"{{ c.boxStyle }}\">{{ c.mark }}<\u002Fdiv>\n              <div style=\"{{ c.textStyle }}\">{{ c.q }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:32px;\">\n        <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#14556B;\">Opening Enquiry — Ready To Send<\u002Fdiv>\n        <div style=\"border:1px solid #DDE1E1; padding:20px; margin-top:12px;\">\n          <div style=\"font-size:17px; color:#101418; line-height:1.7; white-space:pre-wrap;\">{{ sel.enquiry }}<\u002Fdiv>\n          <div style=\"display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center;\">\n            <button sc-camel-on-click=\"{{ copyEnquiry }}\" style=\"background:#14556B; border:1px solid #14556B; color:#FFFFFF; font-size:16px; padding:11px 20px; border-radius:0; cursor:pointer; letter-spacing:0.06em; text-transform:uppercase;\">{{ copyEnquiryLabel }}<\u002Fbutton>\n            <a href=\"{{ sel.chUrl }}\" target=\"_blank\" style=\"border:1px solid #14556B; color:#14556B; font-size:16px; padding:11px 20px; letter-spacing:0.06em; text-transform:uppercase;\">Open their leasing page<\u002Fa>\n            <a href=\"{{ sel.li }}\" target=\"_blank\" style=\"border:1px solid #B6BDBE; color:#3E4A50; font-size:16px; padding:11px 20px; letter-spacing:0.06em; text-transform:uppercase;\">Find the contact<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:32px;\">\n        <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#14556B;\">Full Activity Log<\u002Fdiv>\n        <textarea placeholder=\"Add another note…\" value=\"{{ draft }}\" sc-camel-on-change=\"{{ onDraft }}\" style=\"width:100%; min-height:110px; margin-top:12px; background:#FFFFFF; border:1px solid #B6BDBE; color:#101418; font-size:17px; line-height:1.6; padding:12px; border-radius:0; outline:none; resize:vertical;\"><\u002Ftextarea>\n        <button sc-camel-on-click=\"{{ addLog }}\" style=\"margin-top:12px; background:#14556B; border:1px solid #14556B; color:#FFFFFF; font-size:16px; padding:11px 20px; border-radius:0; cursor:pointer; letter-spacing:0.06em; text-transform:uppercase;\">Log entry as {{ rep }}<\u002Fbutton>\n        <div style=\"margin-top:20px; border-top:1px solid #DDE1E1;\">\n          <sc-for list=\"{{ sel.log }}\" as=\"l\" hint-placeholder-count=\"1\">\n            <div style=\"padding:14px 0; border-bottom:1px solid #E9ECEC;\">\n              <div style=\"font-size:14px; letter-spacing:0.06em; text-transform:uppercase; color:#14556B;\">{{ l.who }} · {{ l.when }}<\u002Fdiv>\n              <div style=\"font-size:17px; color:#101418; line-height:1.6; margin-top:5px; white-space:pre-wrap;\">{{ l.text }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ sel.emptyLog }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:18px 0; font-size:17px; font-style:italic; color:#55606A;\">No activity logged yet.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:32px;\">\n        <div style=\"font-family:'Cormorant Garamond', Garamond, serif; font-size:13px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#14556B;\">Source Of The Number<\u002Fdiv>\n        <div style=\"margin-top:12px; border-top:1px solid #DDE1E1;\">\n          <sc-for list=\"{{ sel.src }}\" as=\"s\" hint-placeholder-count=\"1\">\n            <div style=\"display:grid; grid-template-columns:110px 1fr; gap:16px; padding:12px 0; border-bottom:1px solid #E9ECEC; align-items:baseline;\">\n              <div style=\"font-size:15px; color:#14556B;\">{{ s.d }}<\u002Fdiv>\n              <div style=\"font-size:17px;\"><a href=\"{{ s.u }}\" target=\"_blank\">{{ s.t }}<\u002Fa><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1480,&quot;height&quot;:1200},&quot;repNames&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Amanda Ferrer &lt;amanda@example.com&gt;, Dan Ravaioli &lt;dan@example.com&gt;, Max Stoker &lt;max@example.com&gt;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Team — use Name &lt;name@company.com&gt; so assignment emails address the rep&quot;},&quot;supabaseUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://stpkhpxhqzgruorrupaw.supabase.co&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;CRM bridge — Supabase project URL, e.g. https://abcdefgh.supabase.co&quot;},&quot;supabaseAnonKey&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0cGtocHhocXpncnVvcnJ1cGF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMDMxNjYsImV4cCI6MjA5NDY3OTE2Nn0.1TjVRSpoNGTk6cs4cR2CA3vxAD3aLTTkNZW0IYgkkws&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;CRM bridge — Supabase anon key (safe to paste: RLS is on and writes go through the function only)&quot;},&quot;crmBaseUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://stpkhpxhqzgruorrupaw.supabase.co/rest/v1/&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;CRM bridge — optional custom API base if you front Supabase with your own server&quot;},&quot;bookMinMW&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;min&quot;:1,&quot;max&quot;:200,&quot;unit&quot;:&quot;MW&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Your book&quot;},&quot;bookMaxMW&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:100,&quot;min&quot;:10,&quot;max&quot;:1000,&quot;unit&quot;:&quot;MW&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Your book&quot;},&quot;weightCapacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:30,&quot;min&quot;:0,&quot;max&quot;:60,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Fit score weighting&quot;},&quot;weightNeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:30,&quot;min&quot;:0,&quot;max&quot;:60,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Fit score weighting&quot;},&quot;weightSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:20,&quot;min&quot;:0,&quot;max&quot;:60,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Fit score weighting&quot;},&quot;weightFit&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:20,&quot;min&quot;:0,&quot;max&quot;:60,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Fit score weighting&quot;}}\">\nclass Component extends DCLogic {\n  state = { q:\"\", tierF:\"all\", region:\"all\", stageF:\"all\", owner:\"all\", statusF:\"all\", bookFit:false,\n            sort:\"score\", selId:null, view:\"table\", rep:\"\", draft:\"\", crm:{},\n            assignTo:\"\", assignBrief:\"\", copied:\"\", certOnly:false, pushing:{}, errors:{} };\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem(\"offtake-desk-v2\");\n      if (raw) {\n        const p = JSON.parse(raw);\n        const list = this.reps();\n        const rep = list.indexOf(p.rep) >= 0 ? p.rep : list[0];\n        this.setState({ crm: p.crm || {}, rep: rep });\n        if (rep !== p.rep) { try { localStorage.setItem(\"offtake-desk-v2\", JSON.stringify({ crm: p.crm || {}, rep: rep })); } catch (e) {} }\n        return;\n      }\n    } catch (e) { /* ignore */ }\n    this.setState({ rep: this.reps()[0] });\n  }\n\n  // Accepts \"Name\" or \"Name <name@company.com>\" so the email brief can address them.\n  repEntries() {\n    const s = this.props.repNames ?? \"Amanda Ferrer <amanda@example.com>, Dan Ravaioli <dan@example.com>, Max Stoker <max@example.com>\";\n    return String(s).split(\",\").map(x => x.trim()).filter(Boolean).map(x => {\n      const m = x.match(/^(.*?)\\s*<(.+)>$/);\n      return m ? { name: m[1].trim(), email: m[2].trim() } : { name: x, email: \"\" };\n    });\n  }\n\n  reps() { return this.repEntries().map(r => r.name); }\n\n  repEmail(name) {\n    const e = this.repEntries().filter(r => r.name === name)[0];\n    return e ? e.email : \"\";\n  }\n\n  checklist() {\n    return [\n      \"Is the published megawatt block still uncommitted, and how much of it?\",\n      \"What is the rate per kW per month, and on what term?\",\n      \"When is power actually live, and what is the interconnection status?\",\n      \"What rack density does the hall support, and is it liquid-cooling ready?\",\n      \"What redundancy and certifications does the building carry?\",\n      \"What tenant credit structure do their lenders require for a neocloud?\",\n      \"Who is the named decision-maker, and who else is in the room?\"\n    ];\n  }\n\n  crmBase() {\n    const b = this.props.crmBaseUrl;\n    return b && String(b).trim() ? String(b).trim().replace(/\\/+$/, \"\") : \"https://cncrm.thechiefnegotiators.com/api/v1\";\n  }\n\n  sbUrl() { const v = this.props.supabaseUrl; return v && String(v).trim() ? String(v).trim().replace(/\\/+$/, \"\") : \"\"; }\n  sbKey() { const v = this.props.supabaseAnonKey; return v && String(v).trim() ? String(v).trim() : \"\"; }\n  sbReady() { return !!(this.sbUrl() && this.sbKey()); }\n  rpcUrl() { return this.sbUrl() + \"/rest/v1/rpc/offtake_upsert\"; }\n\n  async pushOne(x) {\n    if (!this.sbReady()) return;\n    const busy = Object.assign({}, this.state.pushing); busy[x.id] = true;\n    const errs = Object.assign({}, this.state.errors); delete errs[x.id];\n    this.setState({ pushing: busy, errors: errs });\n    try {\n      const res = await fetch(this.rpcUrl(), {\n        method: \"POST\",\n        headers: {\n          \"apikey\": this.sbKey(),\n          \"Authorization\": \"Bearer \" + this.sbKey(),\n          \"Content-Type\": \"application/json\"\n        },\n        body: JSON.stringify({ payload: this.payloadFor(x) })\n      });\n      const text = await res.text();\n      if (!res.ok) throw new Error(\"HTTP \" + res.status + \" — \" + text.slice(0, 200));\n      const prev = this.rec(x.id);\n      const log = (prev.log || []).slice();\n      log.unshift({ ts: Date.now(), who: this.state.rep, text: \"Pushed to CRM.\" });\n      this.setRec(x.id, { pushedAt: Date.now(), log: log }, false);\n    } catch (e) {\n      const e2 = Object.assign({}, this.state.errors); e2[x.id] = String(e.message || e);\n      this.setState({ errors: e2 });\n    } finally {\n      const b2 = Object.assign({}, this.state.pushing); delete b2[x.id];\n      this.setState({ pushing: b2 });\n    }\n  }\n\n  domainOf(url) {\n    const m = String(url || \"\").match(/^https?:\\/\\/([^\\/]+)/);\n    return m ? m[1].replace(/^www\\./, \"\") : \"\";\n  }\n\n  payloadFor(x) {\n    const r = this.rec(x.id);\n    return {\n      idempotency_key: x.id + \":\" + (r.touched || 0),\n      external_id: x.id,\n      account: { name: x.op, domain: this.domainOf(x.chUrl), match_on: \"name\" },\n      site: {\n        name: x.site, market: x.mkt, region: x.reg,\n        available_mw: x.avn || null, available_text: x.av,\n        campus_scale: x.scale || null, published_date: x.pub,\n        build_stage: x.stage, power_live: x.rfs,\n        leasing_url: x.chUrl, phone: x.phone,\n        role_targets: x.roles, linkedin_search: x.li\n      },\n      opportunity: { name: x.op + \" — \" + x.site, stage: r.status, owner: r.owner || null, matched_neocloud: r.matched || null },\n      activities: (r.log || []).slice().reverse().map(l => ({ author: l.who, occurred_at: new Date(l.ts).toISOString(), body: l.text })),\n      tasks: this.checklist().map((q, i) => ({ title: q, completed: !!(r.checks || {})[i] }))\n    };\n  }\n\n  hasActivity(x) {\n    const r = this.rec(x.id);\n    return !!r.owner || (r.status && r.status !== \"New\") || (r.log || []).length > 0;\n  }\n\n  queueReason(x) {\n    const r = this.rec(x.id);\n    const out = [];\n    if (r.owner) out.push(\"assigned to \" + r.owner);\n    if (r.status && r.status !== \"New\") out.push(\"stage
