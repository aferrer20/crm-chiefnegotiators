<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM · Sign in</title>
<script src="crm-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0B1629;--card:#111f38;--border:#1e3358;--accent:#14b8a6;--accent2:#0d9488;--text:#eaf2f7;--muted:#7f97b3;--red:#f87171;--amber:#fbbf24}
  body{background:radial-gradient(1100px 550px at 15% -10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 60%),radial-gradient(900px 500px at 100% 110%,rgba(59,130,246,.12),transparent 55%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:420px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:36px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
  .logo{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  h1{text-align:center;font-size:19px;font-weight:800;margin-top:14px}
  .sub{text-align:center;font-size:13px;color:var(--muted);margin-top:6px;margin-bottom:26px}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
  input{width:100%;background:#0e1b30;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--text);outline:none;transition:border-color .15s}
  input:focus{border-color:var(--accent)}
  .btn{width:100%;margin-top:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--btn-text,#04211d);border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;transition:opacity .15s}
  .btn:hover{opacity:.92}
  .btn:disabled{opacity:.55;cursor:default}
  .note{margin-top:22px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.6}
  .msg{border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:18px;display:none}
  .msg.show{display:block}
  .msg.err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--red)}
  .msg.ok{background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);color:var(--text)}
  .msg.warn{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:var(--amber)}
  .center{text-align:center}
  a.link{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loading{text-align:center;color:var(--muted);font-size:14px;padding:20px 0}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="logo" id="logo">⚖️</div></div>
  <h1 id="coName">CRM</h1>
  <div class="sub"><span id="tagline">CRM</span> · secure sign-in</div>

  <div id="loading"><span class="spin"></span> &nbsp;Checking your session…</div>

  <div id="signin" style="display:none">
    <div class="msg" id="msg"></div>
    <label for="email">Work email</label>
    <input id="email" type="email" placeholder="you@company.com" autocomplete="email">
    <button class="btn" id="sendBtn" onclick="sendLink()">Send magic link</button>
    <div class="note" id="accessNote"></div>
  </div>

  <div id="sent" style="display:none">
    <div class="msg ok show">✉️ Check your inbox — we sent a secure sign-in link to <b id="sentTo"></b>. Open it on this device to continue.</div>
    <div class="center note" style="border:none;padding-top:0"><a class="link" onclick="reset()">← Use a different email</a></div>
  </div>

  <div id="denied" style="display:none">
    <div class="msg warn show" id="deniedMsg"></div>
    <div class="center"><a class="link" onclick="signOut()">Sign out & try another account</a></div>
  </div>
</div>

<script>
const CFG = window.__CRM || {};
const SB_URL = CFG.SUPABASE_URL;
const SB_KEY = CFG.SUPABASE_KEY;
const REQUIRE = CFG.COMPANY;
const CO_NAME = CFG.COMPANY_NAME || 'CRM';
const DOMAIN = CFG.DOMAIN || '';
const APP = 'app.html';
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth:{ detectSessionInUrl:true, persistSession:true } });
const $ = id => document.getElementById(id);

// ---- Branding from config ----
document.title = CO_NAME + ' · Sign in';
if(CFG.ACCENT)   document.documentElement.style.setProperty('--accent', CFG.ACCENT);
if(CFG.ACCENT2)  document.documentElement.style.setProperty('--accent2', CFG.ACCENT2);
if(CFG.BTN_TEXT) document.documentElement.style.setProperty('--btn-text', CFG.BTN_TEXT);
$('logo').textContent = CFG.ICON || '⚖️';
$('coName').textContent = CO_NAME;
$('tagline').textContent = CFG.TAGLINE || 'CRM';
$('accessNote').innerHTML = 'Access is granted by your email domain. <b>@'+DOMAIN+'</b> and the account owners '
  + 'can enter this workspace. You’ll receive a one-time sign-in link by email — no password required.';

function show(view){ ['loading','signin','sent','denied'].forEach(v=>$(v).style.display = v===view?'block':'none'); }
function msg(kind,text){ const m=$('msg'); m.className='msg show '+kind; m.textContent=text; }

async function accessibleCompanies(){
  const { data, error } = await sb.from('crm_companies').select('id,name');
  if(error) throw error;
  return data||[];
}

async function routeAfterAuth(){
  let comps;
  try { comps = await accessibleCompanies(); }
  catch(e){
    msg('err','Signed in, but the workspace database isn’t reachable yet. If Supabase was just set up, apply the schema and retry.');
    show('signin'); return;
  }
  if(comps.some(c=>c.id===REQUIRE)){ location.replace(APP); return; }
  const { data:{ user } } = await sb.auth.getUser();
  const email = user? user.email : 'your account';
  $('deniedMsg').innerHTML = 'Signed in as <b>'+email+'</b>, but this account doesn’t have access to the '
    + '<b>'+CO_NAME+'</b> workspace. Access here is limited to <b>@'+DOMAIN+'</b> and the account owners.';
  show('denied');
}

async function init(){
  const params = new URLSearchParams(location.search);
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await routeAfterAuth(); return; }
  show('signin');
  if(params.get('err')) msg('err','Could not verify workspace access. Please sign in again.');
}

async function sendLink(){
  const email = $('email').value.trim().toLowerCase();
  if(!email || !email.includes('@')){ msg('err','Please enter a valid email address.'); return; }
  $('sendBtn').disabled = true; $('sendBtn').innerHTML='<span class="spin"></span>';
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin + location.pathname } });
  $('sendBtn').disabled = false; $('sendBtn').textContent='Send magic link';
  if(error){ msg('err', error.message || 'Could not send link. Try again.'); return; }
  $('sentTo').textContent = email; show('sent');
}

async function signOut(){ await sb.auth.signOut(); location.replace(location.pathname); }
function reset(){ show('signin'); $('email').value=''; }

$('email') && $('email').addEventListener('keydown', e=>{ if(e.key==='Enter') sendLink(); });
init();
</script>
</body>
</html>
